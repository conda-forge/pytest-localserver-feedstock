{% set name = "pytest-localserver" %}
{% set version = "0.10.0" %}
{% set hash = "2607197f390912ab25525d129ac43c3c875049257368b3fe09b5cd03dcc526af" %}
{% set ext = "tar.gz" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ ext }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.{{ ext }}
  sha256: {{ hash }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - aiosmtpd
    - python >={{ python_min }}
    - werkzeug >=0.10

test:
  requires:
    - pytest
    - python {{ python_min }}
  imports:
    - pytest_localserver
  commands:
    - pytest --help

about:
  home: https://github.com/pytest-dev/pytest-localserver
  license: MIT
  license_file: LICENSE
  summary: pytest-localserver is a plugin for the pytest testing framework which enables you to test server connections locally.

extra:
  recipe-maintainers:
    - nicoddemus
